<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>HCIP 题库笔记</title>
<style>
:root {
  --bg: #0f1419;
  --bg2: #1a2332;
  --card: #1e2a3a;
  --border: #2d3a4d;
  --text: #e7ecf3;
  --muted: #8b9bb0;
  --accent: #3b82f6;
  --accent2: #22c55e;
  --warn: #f59e0b;
  --bad: #ef4444;
  --badge821: #6366f1;
  --badge831: #06b6d4;
  --shadow: 0 4px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6f9;
    --bg2: #ffffff;
    --card: #ffffff;
    --border: #d8dee8;
    --text: #1a2332;
    --muted: #5b6b7f;
    --shadow: 0 4px 20px rgba(15,20,25,.08);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
button, input, select { font-family: inherit; color: inherit; }
header {
  flex: none;
  background: color-mix(in srgb, var(--bg2) 92%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px 12px;
  box-shadow: var(--shadow);
  z-index: 5;
}
h1 { font-size: 1.2rem; margin: 0 0 2px; font-weight: 700; }
.sub { color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab, .btn, .mtab {
  appearance: none; border: 1px solid var(--border);
  background: var(--card); color: var(--text);
  padding: 6px 11px; border-radius: 999px; cursor: pointer;
  font-size: .82rem;
}
.tab.active, .mtab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab:focus-visible, .btn:focus-visible, .mtab:focus-visible,
input:focus-visible, select:focus-visible, .q-card:focus-visible, .qref:focus-visible,
button.opt:focus-visible, .q-group-h:focus-visible, .q-open:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
#search, #topic {
  padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: .88rem;
}
#search { flex: 1 1 180px; min-width: 140px; }
#topic { max-width: 100%; }
.stats { color: var(--muted); font-size: .78rem; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 750; }
.mobile-tabs { display: none; gap: 6px; margin-top: 8px; }
.panes {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(320px, 0.96fr) minmax(0, 1.14fr);
  column-gap: 28px;
  padding: 14px 16px 16px;
}
.pane { min-height: 0; }
#q-pane, #n-pane {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: color-mix(in srgb, var(--card) 55%, var(--bg));
}
#q-pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.q-toolbar {
  flex: none;
  padding: 8px 10px 8px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg2) 90%, transparent);
}
.q-toolbar .row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 6px;
}
.dim-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.dim-hint, .key-hint, .quiz-msg {
  color: var(--muted);
  font-size: .75rem;
  margin: 6px 0 0;
  line-height: 1.45;
}
.quiz-msg { color: var(--warn); min-height: 0; }
.quiz-msg:empty { display: none; }
#q-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 4px 8px 28px;
}
#n-pane { overflow: auto; padding: 4px 18px 32px; }
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.badge {
  font-size: .72rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; color: #fff;
}
.badge.b821 { background: var(--badge821); }
.badge.b831 { background: var(--badge831); }
.badge.type, .badge.topic { background: #475569; }
.stem { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .95rem; }
.opts { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 4px; }
button.opt {
  appearance: none;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  padding: 7px 10px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--bg) 70%, var(--card));
  border: 1px solid var(--border);
  font-size: .9rem;
  line-height: 1.45;
  cursor: pointer;
}
button.opt:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
}
button.opt:disabled { cursor: default; opacity: 1; }
button.opt .key { flex: none; font-weight: 700; color: var(--accent); }
button.opt .ot { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
button.opt.picked {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
button.opt.yes {
  background: color-mix(in srgb, #22c55e 22%, var(--card));
  border-color: color-mix(in srgb, #22c55e 55%, var(--border));
}
button.opt.no {
  background: color-mix(in srgb, #ef4444 20%, var(--card));
  border-color: color-mix(in srgb, #ef4444 50%, var(--border));
}
button.opt.missed { border-style: dashed; }
.verdict { flex: none; font-size: .75rem; font-weight: 750; }
.verdict.ok { color: #4ade80; }
.verdict.bad { color: #f87171; }
.verdict.pick { color: var(--muted); font-weight: 650; }
.figs { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.figs img, .note-figs img {
  max-width: 100%; height: auto; border-radius: 10px;
  border: 1px solid var(--border); background: #0001;
}
.ans-box {
  margin-top: 8px; padding: 8px 10px; border-radius: 10px;
  background: color-mix(in srgb, #22c55e 12%, transparent);
  border: 1px solid color-mix(in srgb, #22c55e 35%, var(--border));
}
.ans-label { color: var(--muted); font-size: .75rem; }
.ans-text { font-weight: 650; white-space: pre-wrap; word-break: break-word; }
.judge-line { font-weight: 750; font-size: .85rem; margin-top: 8px; }
.judge-line.ok { color: #4ade80; }
.judge-line.bad { color: #f87171; }
.q-actions, .rate {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 8px;
}
.btn.on-ok { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.btn.on-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.on-remember { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.btn.on-forgot { background: var(--warn); border-color: var(--warn); color: #1a2332; }
.btn.tiny { padding: 2px 8px; font-size: .72rem; }
.btn.quiet { color: var(--muted); }
.export-modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  padding: 16px;
  background: color-mix(in srgb, #000 48%, transparent);
  align-items: center;
  justify-content: center;
}
.export-modal:not([hidden]) { display: flex; }
.export-card {
  width: min(720px, 100%);
  max-height: min(86vh, 840px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 12px 12px 14px;
}
.export-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.export-head h2 { margin: 0; font-size: 1rem; flex: 1 1 auto; }
#export-text {
  margin-top: 10px;
  flex: 1 1 auto;
  min-height: 200px;
  width: 100%;
  resize: none;
  overflow: auto;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  padding: 10px 12px;
  font: 0.88rem/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  white-space: pre-wrap;
  word-break: break-word;
}
.pager {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 6px;
}
.pager .progress { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 7em; }
.jump {
  width: 72px; padding: 6px 8px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hint { color: var(--muted); font-size: .75rem; }
.q-card {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  padding: 8px 10px 10px;
  margin: 6px 0;
  content-visibility: auto;
  contain-intrinsic-size: auto 168px;
}
.q-card.active {
  content-visibility: visible;
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent);
}
.q-card.st-ok { box-shadow: inset 3px 0 0 #22c55e; }
.q-card.st-bad { box-shadow: inset 3px 0 0 #ef4444; }
.q-card.st-seen { box-shadow: inset 3px 0 0 var(--warn); }
.q-card.active.st-ok { box-shadow: inset 3px 0 0 #22c55e, 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent); }
.q-card.active.st-bad { box-shadow: inset 3px 0 0 #ef4444, 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent); }
.q-card.active.st-seen { box-shadow: inset 3px 0 0 var(--warn), 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent); }
.q-open {
  appearance: none; border: 0; background: transparent; padding: 0;
  cursor: pointer; color: inherit; font: inherit;
}
.q-open:hover .q-no { color: var(--accent); }
.q-no { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .78rem; }
.status {
  font-size: .72rem;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0 6px;
}
.status.ok { color: #4ade80; border-color: color-mix(in srgb, #22c55e 55%, var(--border)); }
.status.bad { color: #f87171; border-color: color-mix(in srgb, #ef4444 55%, var(--border)); }
.status.seen { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
.q-group-h {
  display: flex;
  width: 100%;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 2;
  background: color-mix(in srgb, var(--bg2) 94%, var(--bg));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px 10px;
  margin: 8px 0 4px;
  cursor: pointer;
  font-weight: 750;
  text-align: left;
  font-size: .9rem;
}
.q-group-h .g-main { min-width: 0; }
.q-group-h .g-count {
  color: var(--muted);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  flex: none;
}
.legend {
  position: sticky; top: 0; z-index: 2;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  padding: 8px 2px 10px;
  color: var(--muted); font-size: .78rem;
  border-bottom: 1px solid var(--border);
}
.legend b { font-weight: 750; }
.legend .yes { color: #4ade80; }
.legend .no { color: #f87171; }
.legend .answer { color: #93c5fd; }
.legend .gap { color: #fbbf24; }
@media (prefers-color-scheme: light) {
  .legend .yes { color: #15803d; }
  .legend .no { color: #b91c1c; }
  .legend .answer { color: #1d4ed8; }
  .legend .gap { color: #b45309; }
}
.topic-block { margin: 18px 0 8px; }
.topic-block h2 { font-size: 1.15rem; margin: 0 0 4px; }
.topic-block h2 span, .sec-block h3 span { color: var(--muted); font-weight: 550; font-size: .8rem; margin-left: 6px; }
.sec-block { margin: 12px 0; }
.sec-block h3 { font-size: .95rem; margin: 0 0 8px; color: color-mix(in srgb, var(--text) 80%, var(--accent)); }
.note {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  padding: 8px 10px 10px;
  margin: 8px 0;
  cursor: pointer;
}
.note.hit {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent);
}
.refs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.qref {
  appearance: none; border: 1px solid var(--border); background: var(--bg);
  border-radius: 999px; padding: 1px 8px; cursor: pointer; font-size: .72rem;
  font-variant-numeric: tabular-nums;
}
.qref.here { background: var(--accent); border-color: var(--accent); color: #fff; }
.lead {
  margin: 0 0 6px; color: var(--muted); font-size: .82rem;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; cursor: pointer; white-space: pre-wrap; word-break: break-word;
}
.lead.open, .note.hit .lead { display: block; -webkit-line-clamp: unset; }
.line { margin: 6px 0; padding: 2px 0 2px 8px; border-left: 3px solid var(--border); white-space: pre-wrap; word-break: break-word; }
.line.yes { border-color: #22c55e; }
.line.no { border-color: #ef4444; }
.line.answer { border-color: #3b82f6; }
.line.gap { border-color: #f59e0b; }
.line .tag { font-size: .72rem; font-weight: 750; margin-right: 6px; }
.line.yes .tag { color: #4ade80; }
.line.no .tag { color: #f87171; }
.line.answer .tag { color: #93c5fd; }
.line.gap .tag { color: #fbbf24; }
mark.bad-bit {
  background: color-mix(in srgb, #f87171 34%, transparent);
  color: inherit;
  padding: 0 2px;
  border-radius: 3px;
}
.line .fix {
  margin: 4px 0 0;
  font-size: .86rem;
  line-height: 1.45;
  color: color-mix(in srgb, var(--text) 86%, #f87171);
}
@media (prefers-color-scheme: light) {
  mark.bad-bit { background: #fecaca; }
  .line .fix { color: #7f1d1d; }
  .line.yes .tag { color: #15803d; }
  .line.no .tag { color: #b91c1c; }
  .line.answer .tag { color: #1d4ed8; }
  .line.gap .tag { color: #b45309; }
  button.opt.yes { background: color-mix(in srgb, #86efac 45%, #fff); }
  button.opt.no { background: color-mix(in srgb, #fecaca 55%, #fff); }
  .verdict.ok, .judge-line.ok, .status.ok { color: #15803d; }
  .verdict.bad, .judge-line.bad, .status.bad { color: #b91c1c; }
  .status.seen { color: #b45309; }
}
.empty { color: var(--muted); text-align: center; padding: 28px 10px; }
footer.note-end { color: var(--muted); font-size: .75rem; text-align: center; margin-top: 18px; }
@media (max-width: 900px) {
  body { height: auto; overflow: auto; }
  .mobile-tabs { display: flex; }
  .panes { display: block; column-gap: 0; padding: 0; }
  #q-pane, #n-pane { border: 0; border-radius: 0; }
  #q-pane { overflow: visible; height: auto; }
  #q-list { overflow: visible; max-height: none; flex: none; }
  #n-pane { overflow: visible; }
  body.mode-q #n-pane { display: none; }
  body.mode-n #q-pane { display: none; }
  .q-group-h { top: 0; }
}
</style>
</head>
<body class="mode-q">
<header>
  <h1>HCIP 题库笔记</h1>
  <p class="sub">H12-821 486 题 · H12-831 379 题。左侧先做题再对答案；点题目，右侧滚到对应笔记。右侧只整理本题库里被肯定的说法、被否定的说法和直接答案，不另补教材解释。</p>
  <div class="toolbar">
    <div class="tabs" role="tablist" id="banks" aria-label="题库">
      <button type="button" class="tab active" data-bank="all">全部</button>
      <button type="button" class="tab" data-bank="H12-821">H12-821</button>
      <button type="button" class="tab" data-bank="H12-831">H12-831</button>
    </div>
    <select id="topic" aria-label="按主题筛选"></select>
    <input id="search" type="search" placeholder="搜索题干、选项或答案…" autocomplete="off" />
  </div>
  <div class="stats" id="count" aria-live="polite"></div>
  <div class="mobile-tabs" role="tablist">
    <button type="button" class="mtab active" data-mode="q">题目</button>
    <button type="button" class="mtab" data-mode="n">笔记</button>
  </div>
</header>
<div class="panes">
  <section class="pane" id="q-pane" aria-label="题目">
    <div class="q-toolbar">
      <div class="dim-tabs" id="dims" role="tablist" aria-label="分组维度">
        <button type="button" class="tab active" data-dim="topic" role="tab">主题</button>
        <button type="button" class="tab" data-dim="qtype" role="tab">题型</button>
        <button type="button" class="tab" data-dim="memory" role="tab" title="记忆型基础考点">记忆考点</button>
        <button type="button" class="tab" data-dim="style" role="tab">提问方式</button>
        <button type="button" class="tab" data-dim="ease" role="tab" title="好拿分程度">好拿分</button>
      </div>
      <p class="dim-hint" id="dim-hint"></p>
      <div class="row">
        <div class="tabs" id="practice" role="tablist" aria-label="练习筛选">
          <button type="button" class="tab active" data-practice="all">全部</button>
          <button type="button" class="tab" data-practice="new">没做过</button>
          <button type="button" class="tab" data-practice="wrong">做错过</button>
          <button type="button" class="tab" data-practice="forgot">没记住</button>
        </div>
        <button type="button" class="btn quiet" id="export-quiz">导出错题</button>
        <button type="button" class="btn quiet" id="reset-quiz">清除练习记录</button>
      </div>
      <div class="pager">
        <button type="button" class="btn" id="prev">上一题</button>
        <div class="progress" id="pos">第 0 / 0 题</div>
        <button type="button" class="btn" id="next">下一题</button>
        <label class="hint" for="jump">本组</label>
        <input class="jump" id="jump" type="number" min="1" inputmode="numeric" />
        <button type="button" class="btn" id="expand-all">展开全部</button>
        <button type="button" class="btn" id="collapse-all">收起</button>
      </div>
      <p class="key-hint">单选点选项即作答，多选勾选后点提交。键盘：A–F 或 1–6 选择，Enter 提交或看答案，N 或 → 下一题。</p>
      <p class="quiz-msg" id="quiz-msg" role="status"></p>
    </div>
    <div id="q-list"></div>
  </section>
  <section class="pane" id="n-pane" aria-label="笔记"></section>
</div>
<div id="export-modal" class="export-modal" hidden>
  <div class="export-card" role="dialog" aria-modal="true" aria-labelledby="export-title">
    <div class="export-head">
      <h2 id="export-title">错题导出</h2>
      <button type="button" class="btn" id="export-copy">复制</button>
      <button type="button" class="btn" id="export-close">关闭</button>
    </div>
    <textarea id="export-text" readonly aria-label="错题纯文本"></textarea>
  </div>
</div>
<script src="notes-data.js"></script>
<script>
(function () {
  var DATA = window.STUDY_DATA;
  var listEl = document.getElementById("q-list");
  var notesEl = document.getElementById("n-pane");
  var countEl = document.getElementById("count");
  var hintEl = document.getElementById("dim-hint");
  var quizMsg = document.getElementById("quiz-msg");
  var posEl = document.getElementById("pos");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var jumpEl = document.getElementById("jump");
  if (!DATA || !DATA.questions) {
    listEl.textContent = "题库数据没有加载。";
    return;
  }

  var QUIZ_KEY = "hcip-quiz-v1";
  var UI_KEY = "hcip-notes-ui";
  var SHORT_STEM = 60;
  var LONG_STEM = 120;
  var TYPE_SHORT = { "单选题": "单选", "多选题": "多选", "填空题": "填空", "简答题": "简答", "判断题": "判断" };
  var LINE_TAG = { yes: "成立", no: "不成立", answer: "答案", gap: "无文字结论" };
  var DIMS = ["topic", "qtype", "memory", "style", "ease"];
  var PRACTICES = ["all", "new", "wrong", "forgot"];
  var TYPE_ORDER = ["tf", "single", "multi", "blank", "short"];

        '<span class="g-main">' + (open ? "▾ " : "▸ ") + esc(g.label) + "</span>" +
        '<span class="g-count" data-count="' + g.items.length + '">' + g.items.length + "</span>" +
        "</button>" + body + "</section>";
    }).join("");
    listEl.innerHTML = html;
    listEl.dataset.total = String(view.length);
    listEl.scrollTop = top;
  }
  function findCard(id) {
    var nodes = listEl.querySelectorAll(".q-card");
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].dataset.id === id) return nodes[i];
    }
    return null;
  }
  function paintCard(id) {
    var el = findCard(id);
    var q = byId.get(id);
    if (!el || !q) return;
    var tmp = document.createElement("div");
    tmp.innerHTML = cardHtml(q);
    el.replaceWith(tmp.firstElementChild);
  }
  function renderNotes() {
    var ids = new Set(view.map(function (q) { return q.id; }));
    var html = '<div class="legend"><b class="yes">成立</b> 题库肯定的说法 · <b class="no">不成立</b> 判断题或找错项里被否定的说法，浅红是错误措辞，下面一句是正确说法 · <b class="answer">答案</b> 这道题选出的项或填空 · <b class="gap">无文字结论</b> 答案只在配图里</div>';
    var any = false;
    DATA.notes.forEach(function (topicBlock) {
      var sections = [];
      (topicBlock.sections || []).forEach(function (sec) {
        var items = (sec.items || []).filter(function (it) {
          return (it.qids || []).some(function (id) { return ids.has(id); });
        });
        if (items.length) sections.push({ sec: sec, items: items });
      });
      if (!sections.length) return;
      any = true;
      var shown = sections.reduce(function (n, s) { return n + s.items.length; }, 0);
      html += '<article class="topic-block" id="topic-' + esc(topicBlock.id) + '">';
      html += "<h2>" + esc(topicBlock.title) + "<span>" + shown + " 条</span></h2>";
      sections.forEach(function (wrap) {
        html += '<section class="sec-block"><h3>' + esc(wrap.sec.title) + "<span>" + wrap.items.length + "</span></h3>";
        wrap.items.forEach(function (it) {
          var qids = (it.qids || []).filter(function (id) { return ids.has(id); });
          html += '<article class="note" data-qids="' + esc(qids.join(",")) + '" id="note-' + esc(qids[0]) + '">';
          html += '<div class="refs">';
          qids.forEach(function (id) {
            var q = byId.get(id);
            html += '<button type="button" class="qref" data-qid="' + esc(id) + '">' + esc(q ? label(q) : id) + "</button>";
          });
          html += "</div>";
          if (it.lead) html += '<p class="lead">' + esc(it.lead) + "</p>";
          (it.lines || []).forEach(function (line) {
            var p = line.p || "answer";
            html += '<div class="line ' + esc(p) + '"><span class="tag">' + esc(LINE_TAG[p] || "笔记") + "</span>" + markFalse(line.t, p === "no" ? line.hi : "");
            if (p === "no" && line.fix) html += '<p class="fix">' + esc(line.fix) + "</p>";
            html += "</div>";
          });
          if (it.images && it.images.length) {
            html += '<div class="note-figs">' + it.images.map(function (src) {
              return '<img src="' + esc(src) + '" alt="题目配图" loading="lazy" referrerpolicy="no-referrer" />';
            }).join("") + "</div>";
          }
          html += "</article>";
        });
        html += "</section>";
      });
      html += "</article>";
    });
    if (!any) html += '<div class="empty">当前筛选下没有笔记</div>';
    html += '<footer class="note-end">笔记共覆盖两个题库 865 题 · 仅供个人复习</footer>';
    notesEl.innerHTML = html;
  }
  function scrollInto(container, el, align, pad) {
    if (!el) return;
    var paneScrolls = container && container.scrollHeight > container.clientHeight + 8;
    if (!paneScrolls) {
      try { el.scrollIntoView({ block: align === "center" ? "center" : "nearest" }); } catch (e) {}
      return;
    }
    var cRect = container.getBoundingClientRect();
    var eRect = el.getBoundingClientRect();
    var delta;
    if (align === "center") {
      var legend = container.querySelector(".legend");
      var legendH = legend ? legend.offsetHeight : 0;
      var visibleH = Math.max(40, container.clientHeight - legendH);
      if (eRect.height >= visibleH - 16) {
        delta = eRect.top - (cRect.top + legendH + 10);
      } else {
        var viewCenter = cRect.top + legendH + visibleH / 2;
        var elCenter = eRect.top + eRect.height / 2;
        delta = elCenter - viewCenter;
      }
    } else {
      delta = eRect.top - cRect.top - (pad || 8);
    }
    var max = Math.max(0, container.scrollHeight - container.clientHeight);
    container.scrollTop = Math.max(0, Math.min(max, container.scrollTop + delta));
  }
  function highlight(opts) {
    listEl.querySelectorAll(".q-card").forEach(function (el) {
      el.classList.toggle("active", el.dataset.id === selected);
    });
    notesEl.querySelectorAll(".note").forEach(function (el) {
      var ids = (el.dataset.qids || "").split(",");
      var on = ids.indexOf(selected) >= 0;
      el.classList.toggle("hit", on);
      el.querySelectorAll(".qref").forEach(function (btn) {
        btn.classList.toggle("here", btn.dataset.qid === selected);
      });
    });
    if (!(opts && (opts.scrollList || opts.scrollNote))) return;
    requestAnimationFrame(function () {
      if (opts.scrollList) {
        var active = findCard(selected);
        scrollInto(listEl, active, "start", 52);
      }
      if (opts.scrollNote) {
        var hit = notesEl.querySelector(".note.hit");
        scrollInto(notesEl, hit, "center");
        if (window.matchMedia("(max-width: 900px)").matches && document.body.classList.contains("mode-n")) {
          try { hit && hit.scrollIntoView({ block: "center" }); } catch (e) {}
        }
      }
    });
  }
  function practiceCounts() {
    var c = { all: 0, neu: 0, wrong: 0, forgot: 0 };
    DATA.questions.forEach(function (q) {
      if (!inScope(q)) return;
      c.all++;
      var r = quiz.items[q.id];
      if (!(r && r.answered)) c.neu++;
      if (r && r.answered && r.correct === false) c.wrong++;
      if (r && r.selfRating === "forgot") c.forgot++;
    });
    return c;
  }
  function updateStats() {
    var done = 0;
    var right = 0;
    DATA.questions.forEach(function (q) {
      var r = quiz.items[q.id];
      if (r && r.answered) {
        done++;
        if (r.correct === true) right++;
      }
    });
    var q = byId.get(selected);
    countEl.innerHTML = "已做 <b>" + done + "</b> / " + DATA.questions.length + "，正确 <b>" + right + "</b>"
      + " · 当前 " + view.length + " 题"
      + (q ? (" · 正在看 " + esc(label(q))) : "");
    var loc = locateSelected();
    var flat = flatItems();
    var idx = flat.findIndex(function (item) { return item.id === selected; });
    if (loc.group) {
      posEl.textContent = loc.group.label + " · 第 " + (loc.index + 1) + " / " + loc.group.items.length;
      jumpEl.max = String(loc.group.items.length);
      if (document.activeElement !== jumpEl) jumpEl.value = String(loc.index + 1);
    } else {
      posEl.textContent = flat.length ? "不在当前筛选中" : "没有题目";
      jumpEl.max = "1";
    }
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx < 0 || idx >= flat.length - 1;
    var pc = practiceCounts();
    var names = { all: "全部", new: "没做过", wrong: "做错过", forgot: "没记住" };
    var nums = { all: pc.all, new: pc.neu, wrong: pc.wrong, forgot: pc.forgot };
    document.querySelectorAll("#practice .tab").forEach(function (btn) {
      var key = btn.dataset.practice;
      btn.textContent = names[key] + " " + nums[key];
      btn.classList.toggle("active", key === practice);
      btn.setAttribute("aria-pressed", key === practice ? "true" : "false");
    });
  }
  function syncControls() {
    document.querySelectorAll("#banks .tab").forEach(function (b) {
      b.classList.toggle("active", b.dataset.bank === bank);
      b.setAttribute("aria-pressed", b.dataset.bank === bank ? "true" : "false");
    });
    document.querySelectorAll("#dims .tab").forEach(function (b) {
      var on = b.dataset.dim === dim;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    var easeBtn = document.querySelector('#dims [data-dim="ease"]');
    if (easeBtn) easeBtn.title = "好拿分程度。" + EASE_HINT;
    topicSel.value = topic;
    searchEl.value = query;
    hintEl.textContent = DIM_HINT[dim] || "";
    updateStats();
  }
  function saveUi() {
    try {
      sessionStorage.setItem(UI_KEY, JSON.stringify({
        bank: bank, topic: topic, query: query, selected: selected, dim: dim, practice: practice
      }));
    } catch (e) {}
  }
  function fillTopicSelect() {
    var html = '<option value="all">全部主题</option>';
    DATA.topics.forEach(function (t) {
      html += '<option value="' + esc(t.id) + '">' + esc(t.title) + "（" + t.count + "）</option>";
    });
    topicSel.innerHTML = html;
  }
  function renderAll(opts) {
    applyView();
    if (!view.some(function (q) { return q.id === selected; }) && view[0]) selected = view[0].id;
    if (!opts || opts.autoOpen !== false) autoOpen();
    syncControls();
    renderList();
    renderNotes();
    highlight(opts || {});
    saveUi();
  }
  function flash(msg) {
    quizMsg.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { quizMsg.textContent = ""; }, 2200);
  }
  function select(id, opts) {
    if (!byId.has(id)) return;
    var wasInView = view.some(function (q) { return q.id === id; });
    if (!wasInView) {
      bank = "all";
      topic = "all";
      query = "";
      practice = "all";
      applyView();
    }
    selected = id;
    var r = quiz.items[id];
    if (r) {
      r.lastSeen = Date.now();
      saveQuiz();
    }
    var b = bucketOf(byId.get(id));
    var needList = !wasInView || !openGroups.has(b.id);
    openGroups.add(b.id);
    if (!wasInView) {
      syncControls();
      renderNotes();
    }
    if (needList) renderList();
    else {
      listEl.querySelectorAll(".q-card").forEach(function (el) {
        el.classList.toggle("active", el.dataset.id === selected);
      });
    }
    updateStats();
    highlight(opts || {});
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    saveUi();
  }
  function step(delta) {
    var items = flatItems();
    var idx = items.findIndex(function (q) { return q.id === selected; });
    var next = idx + delta;
    if (next < 0 || next >= items.length) return;
    select(items[next].id, { scrollNote: true, scrollList: true });
  }
  function grade(id, picks) {
    var q = byId.get(id);
    if (!q || isLocked(q)) return;
    var keys = q.answerKeys.slice().sort();
    var got = picks.slice().sort();
    var ok = keys.length === got.length && keys.every(function (k, i) { return k === got[i]; });
    var r = recOf(id);
    r.answered = true;
    r.correct = ok;
    r.picks = picks.slice();
    r.lastSeen = Date.now();
    draft.delete(id);
    saveQuiz();
    if (findCard(id)) paintCard(id);
    else renderList();
    updateStats();
  }
  function reveal(id) {
    var q = byId.get(id);
    if (!q) return;
    var r = recOf(id);
    if (!r.answered) {
      r.answered = true;
      r.correct = null;
    }
    r.lastSeen = Date.now();
    saveQuiz();
    if (findCard(id)) paintCard(id);
    else renderList();
    updateStats();
  }
  function selfGrade(id, ok) {
    var r = recOf(id);
    r.answered = true;
    r.correct = ok;
    r.lastSeen = Date.now();
    saveQuiz();
    if (findCard(id)) paintCard(id);
    updateStats();
  }
  function rate(id, rating) {
    var r = recOf(id);
    if (!r.answered) return;
    r.selfRating = rating;
    r.lastSeen = Date.now();
    saveQuiz();
    if (findCard(id)) paintCard(id);
    updateStats();
  }
  function toggleDraft(id, key) {
    var cur = (draft.get(id) || []).slice();
    var i = cur.indexOf(key);
    if (i >= 0) cur.splice(i, 1);
    else cur.push(key);
    draft.set(id, cur);
  }
  function onOptClick(id, key) {
    var q = byId.get(id);
    if (!q) return;
    if (selected !== id) select(id, { scrollNote: true });
    if (isLocked(q)) return;
    if (!q.options.some(function (o) { return o.k === key; })) return;
    if (q.type === "多选题") {
      toggleDraft(id, key);
      paintCard(id);
      return;
    }
    grade(id, [key]);
  }
  function submitId(id) {
    var q = byId.get(id);
    if (!q) return;
    if (selected !== id) select(id, { scrollNote: true });
    if (!q.options.length) {
      reveal(id);
      return;
    }
    if (isLocked(q)) return;
    var picks = draft.get(id) || [];
    if (!picks.length) {
      flash("请先选择选项");
      return;
    }
    grade(id, picks);
  }
  function submitSelected() {
    var q = byId.get(selected);
    if (!q) return;
    if (!q.options.length) {
      var r = quiz.items[q.id];
      if (r && r.answered) return;
      reveal(q.id);
      return;
    }
    submitId(q.id);
  }
  function pickKey(q, key) {
    if (!q.options.some(function (o) { return o.k === key; })) return;
    if (selected !== q.id) select(q.id, { scrollNote: true, scrollList: true });
    if (isLocked(q)) return;
    if (q.type === "多选题") toggleDraft(q.id, key);
    else draft.set(q.id, [key]);
    paintCard(q.id);
  }
  function setMode(mode) {
    document.body.classList.toggle("mode-q", mode === "q");
    document.body.classList.toggle("mode-n", mode === "n");
    document.querySelectorAll(".mtab").forEach(function (b) {
      b.classList.toggle("active", b.dataset.mode === mode);
    });
  }
  function isTyping(el) {
    if (!el || !el.tagName) return false;
    var tag = el.tagName.toLowerCase();
    return tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable;
  }

  fillTopicSelect();
  try {
    var saved = JSON.parse(sessionStorage.getItem(UI_KEY) || "null");
    if (saved && typeof saved === "object") {
      if (saved.bank === "all" || saved.bank === "H12-821" || saved.bank === "H12-831") bank = saved.bank;
      if (saved.topic === "all" || topicTitle[saved.topic]) topic = saved.topic;
      if (typeof saved.query === "string") query = saved.query;
      if (saved.selected && byId.has(saved.selected)) selected = saved.selected;
      if (DIMS.indexOf(saved.dim) >= 0) dim = saved.dim;
      if (PRACTICES.indexOf(saved.practice) >= 0) practice = saved.practice;
    }
  } catch (e) {}
  var hash = "";
  try { hash = decodeURIComponent((location.hash || "").replace(/^#/, "")); } catch (e) { hash = ""; }
  if (byId.has(hash)) {
    selected = hash;
    bank = "all";
    topic = "all";
    query = "";
    practice = "all";
  }

  document.getElementById("banks").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-bank]");
    if (!btn) return;
    bank = btn.dataset.bank;
    renderAll({ scrollList: true, autoOpen: true });
  });
  topicSel.addEventListener("change", function () {
    topic = topicSel.value;
    renderAll({ scrollList: true, scrollNote: true, autoOpen: true });
  });
  searchEl.addEventListener("input", function () {
    query = searchEl.value.trim().toLowerCase();
    renderAll({ autoOpen: true });
  });
  document.getElementById("dims").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-dim]");
    if (!btn || DIMS.indexOf(btn.dataset.dim) < 0) return;
    dim = btn.dataset.dim;
    renderAll({ scrollList: true, autoOpen: true });
  });
  document.getElementById("practice").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-practice]");
    if (!btn || PRACTICES.indexOf(btn.dataset.practice) < 0) return;
    practice = btn.dataset.practice;
    renderAll({ scrollList: true, autoOpen: true });
  });
  document.getElementById("export-quiz").addEventListener("click", openExport);
  document.getElementById("export-close").addEventListener("click", closeExport);
  document.getElementById("export-copy").addEventListener("click", copyExport);
  document.getElementById("export-modal").addEventListener("click", function (e) {
    if (e.target.id === "export-modal") closeExport();
  });
  document.getElementById("reset-quiz").addEventListener("click", function () {
    if (!window.confirm("清除这台浏览器里保存的练习记录？题目和笔记不会受影响。")) return;
    quiz = emptyQuiz();
    draft.clear();
    try { localStorage.removeItem(QUIZ_KEY); } catch (e) {}
    practice = "all";
    renderAll({ scrollList: true, autoOpen: true });
    flash("练习记录已清除");
  });
  document.getElementById("expand-all").addEventListener("click", function () {
    buildGroups().forEach(function (g) { openGroups.add(g.id); });
    renderList();
    highlight({ scrollList: true });
  });
  document.getElementById("collapse-all").addEventListener("click", function () {
    openGroups = new Set();
    var q = byId.get(selected);
    if (q && view.some(function (item) { return item.id === q.id; })) openGroups.add(bucketOf(q).id);
    renderList();
    highlight({ scrollList: true });
  });
  prevBtn.addEventListener("click", function () { step(-1); });
  nextBtn.addEventListener("click", function () { step(1); });
  function jumpTo() {
    var loc = locateSelected();
    if (!loc.group) return;
    var n = parseInt(jumpEl.value, 10);
    if (!n || n < 1 || n > loc.group.items.length) return;
    select(loc.group.items[n - 1].id, { scrollNote: true, scrollList: true });
  }
  jumpEl.addEventListener("change", jumpTo);
  jumpEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    jumpTo();
  });
  document.querySelectorAll(".mtab").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });
  listEl.addEventListener("click", function (e) {
    var head = e.target.closest(".q-group-h");
    if (head) {
      var gid = head.dataset.gid;
      if (openGroups.has(gid)) openGroups.delete(gid);
      else openGroups.add(gid);
      var top = listEl.scrollTop;
      renderList();
      listEl.scrollTop = top;
      return;
    }
    var card = e.target.closest(".q-card");
    if (!card) return;
    var id = card.dataset.id;
    var act = e.target.closest("[data-act]");
    if (!act) {
      select(id, { scrollNote: true });
      return;
    }
    if (act.dataset.act === "opt") onOptClick(id, act.dataset.key);
    else if (act.dataset.act === "submit") submitId(id);
    else if (act.dataset.act === "reveal") {
      if (selected !== id) select(id, { scrollNote: true });
      reveal(id);
    } else if (act.dataset.act === "grade") selfGrade(id, act.dataset.ok === "1");
    else if (act.dataset.act === "rate") rate(id, act.dataset.rate);
    else if (act.dataset.act === "note") {
      select(id, { scrollNote: true });
      if (window.matchMedia("(max-width: 900px)").matches) setMode("n");
    } else if (act.dataset.act === "open") select(id, { scrollNote: true });
  });
  notesEl.addEventListener("click", function (e) {
    var lead = e.target.closest(".lead");
    if (lead && !e.target.closest(".qref")) lead.classList.toggle("open");
    var ref = e.target.closest("[data-qid]");
    var card = e.target.closest(".note");
    var qid = (ref && ref.dataset.qid) || (card && (card.dataset.qids || "").split(",").filter(Boolean)[0]);
    if (!qid) return;
    if (window.matchMedia("(max-width: 900px)").matches) setMode("q");
    select(qid, { scrollList: true });
  });
  document.addEventListener("keydown", function (e) {
    if (!document.getElementById("export-modal").hidden) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeExport();
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target)) return;
    var q = byId.get(selected);
    if (e.key === "ArrowRight" || e.key === "n" || e.key === "N") {
      e.preventDefault();
      step(1);
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      step(-1);
      return;
    }
    if (e.key === "/" ) {
      e.preventDefault();
      searchEl.focus();
      return;
    }
    if (e.key === "Enter") {
      var btn = e.target.closest && e.target.closest("button");
      if (btn && !btn.closest(".q-card")) return;
      if (btn && btn.dataset.act && ["rate", "grade", "note", "open"].indexOf(btn.dataset.act) >= 0) return;
      e.preventDefault();
      submitSelected();
      return;
    }
    if (!q) return;
    var letter = "";
    if (/^[1-6]$/.test(e.key)) {
      var idx = parseInt(e.key, 10) - 1;
      letter = (q.options[idx] || {}).k || "";
    } else if (/^[a-fA-F]$/.test(e.key)) letter = e.key.toUpperCase();
    if (letter) {
      e.preventDefault();
      pickKey(q, letter);
    }
  });

  try {
    renderAll({ scrollList: true, scrollNote: byId.has(hash), autoOpen: true });
  } catch (err) {
    quiz = emptyQuiz();
    try { listEl.innerHTML = '<div class="empty">题目列表渲染失败。练习记录已临时忽略，刷新后若仍如此，请清除站点数据。</div>'; } catch (e2) {}
  }
})();
</script>
</body>
</html>
