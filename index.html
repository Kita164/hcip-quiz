<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>HCIP 题库笔记</title>
<style>
:root {
  --bg: #0f1419;
  --bg2: #1a2332;
  --card: #1e2a3a;
  --border: #2d3a4d;
  --text: #e7ecf3;
  --muted: #8b9bb0;
  --accent: #3b82f6;
  --accent2: #22c55e;
  --warn: #f59e0b;
  --bad: #ef4444;
  --badge821: #6366f1;
  --badge831: #06b6d4;
  --shadow: 0 4px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6f9;
    --bg2: #ffffff;
    --card: #ffffff;
    --border: #d8dee8;
    --text: #1a2332;
    --muted: #5b6b7f;
    --shadow: 0 4px 20px rgba(15,20,25,.08);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
button, input, select { font-family: inherit; color: inherit; }
header {
  flex: none;
  background: color-mix(in srgb, var(--bg2) 92%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px 12px;
  box-shadow: var(--shadow);
  z-index: 5;
}
h1 { font-size: 1.2rem; margin: 0 0 2px; font-weight: 700; }
.sub { color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab, .btn, .mtab {
  appearance: none; border: 1px solid var(--border);
  background: var(--card); color: var(--text);
  padding: 6px 11px; border-radius: 999px; cursor: pointer;
  font-size: .82rem;
}
.tab.active, .mtab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab:focus-visible, .btn:focus-visible, .mtab:focus-visible,
input:focus-visible, select:focus-visible, .q-item:focus-visible, .qref:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
#search, #topic {
  padding: 7px 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: .88rem;
}
#search { flex: 1 1 180px; min-width: 140px; }
#topic { max-width: 100%; }
.stats { color: var(--muted); font-size: .78rem; margin-top: 6px; }
.mobile-tabs { display: none; gap: 6px; margin-top: 8px; }
.panes {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 28px;
  padding: 14px 16px 16px;
}
.pane { min-height: 0; }
#q-pane, #n-pane {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: color-mix(in srgb, var(--card) 55%, var(--bg));
}
#q-pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#detail {
  flex: 1.15 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.stem-wrap, .choice-wrap {
  flex: 1 1 0;
  min-height: 0;
  overflow: auto;
}
.choice-wrap {
  flex-grow: 1.2;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
#q-list { flex: 0.85 1 0; min-height: 0; overflow: auto; padding: 6px; }
#n-pane { overflow: auto; padding: 4px 18px 32px; }
.meta {
  flex: 0 0 28px;
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
  overflow-x: auto;
  overflow-y: hidden;
}
.badge {
  font-size: .72rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; color: #fff;
}
.badge.b821 { background: var(--badge821); }
.badge.b831 { background: var(--badge831); }
.badge.type, .badge.topic { background: #475569; }
.stem { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .95rem; }
.opts { list-style: none; padding: 0; margin: 0; }
.opt {
  padding: 7px 10px; margin: 4px 0; border-radius: 10px;
  background: color-mix(in srgb, var(--bg) 70%, var(--card));
  border: 1px solid var(--border); font-size: .9rem;
}
.opt .key { font-weight: 700; color: var(--accent); margin-right: 6px; }
.opt.yes {
  background: color-mix(in srgb, #22c55e 22%, var(--card));
  border-color: color-mix(in srgb, #22c55e 55%, var(--border));
}
.opt.no {
  background: color-mix(in srgb, #ef4444 20%, var(--card));
  border-color: color-mix(in srgb, #ef4444 50%, var(--border));
}
.figs { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
.figs img, .note-figs img {
  max-width: 100%; height: auto; border-radius: 10px;
  border: 1px solid var(--border); background: #0001;
}
.ans-box {
  margin-top: 8px; padding: 8px 10px; border-radius: 10px;
  background: color-mix(in srgb, #22c55e 12%, transparent);
  border: 1px solid color-mix(in srgb, #22c55e 35%, var(--border));
}
.ans-box.no {
  background: color-mix(in srgb, #ef4444 12%, transparent);
  border-color: color-mix(in srgb, #ef4444 35%, var(--border));
}
.ans-label { color: var(--muted); font-size: .75rem; }
.ans-text { font-weight: 650; white-space: pre-wrap; word-break: break-word; }
.pager {
  flex: 0 0 46px;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
  overflow-x: auto;
}
.pager .progress { font-variant-numeric: tabular-nums; font-weight: 650; min-width: 7em; text-align: center; }
.jump {
  width: 72px; padding: 6px 8px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hint { color: var(--muted); font-size: .75rem; }
.q-item {
  display: block; width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent;
  border-radius: 10px; padding: 7px 8px; cursor: pointer; margin: 2px 0;
}
.q-item:hover { background: color-mix(in srgb, var(--card) 80%, transparent); }
.q-item.active {
  background: color-mix(in srgb, var(--accent) 16%, var(--card));
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
}
.q-item .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.q-no { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .78rem; }
.q-one {
  display: block; color: var(--muted); font-size: .8rem; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.legend {
  position: sticky; top: 0; z-index: 2;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  padding: 8px 2px 10px;
  color: var(--muted); font-size: .78rem;
  border-bottom: 1px solid var(--border);
}
.legend b { font-weight: 750; }
.legend .yes { color: #4ade80; }
.legend .no { color: #f87171; }
.legend .answer { color: #93c5fd; }
.legend .gap { color: #fbbf24; }
@media (prefers-color-scheme: light) {
  .legend .yes { color: #15803d; }
  .legend .no { color: #b91c1c; }
  .legend .answer { color: #1d4ed8; }
  .legend .gap { color: #b45309; }
}
.topic-block { margin: 18px 0 8px; }
.topic-block h2 { font-size: 1.15rem; margin: 0 0 4px; }
.topic-block h2 span, .sec-block h3 span { color: var(--muted); font-weight: 550; font-size: .8rem; margin-left: 6px; }
.sec-block { margin: 12px 0; }
.sec-block h3 { font-size: .95rem; margin: 0 0 8px; color: color-mix(in srgb, var(--text) 80%, var(--accent)); }
.note {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  padding: 8px 10px 10px;
  margin: 8px 0;
  cursor: pointer;
}
.note.hit {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent);
}
.refs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.qref {
  appearance: none; border: 1px solid var(--border); background: var(--bg);
  border-radius: 999px; padding: 1px 8px; cursor: pointer; font-size: .72rem;
  font-variant-numeric: tabular-nums;
}
.qref.here { background: var(--accent); border-color: var(--accent); color: #fff; }
.lead {
  margin: 0 0 6px; color: var(--muted); font-size: .82rem;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; cursor: pointer; white-space: pre-wrap; word-break: break-word;
}
.lead.open, .note.hit .lead { display: block; -webkit-line-clamp: unset; }
.line { margin: 6px 0; padding: 2px 0 2px 8px; border-left: 3px solid var(--border); white-space: pre-wrap; word-break: break-word; }
.line.yes { border-color: #22c55e; }
.line.no { border-color: #ef4444; }
.line.answer { border-color: #3b82f6; }
.line.gap { border-color: #f59e0b; }
.line .tag { font-size: .72rem; font-weight: 750; margin-right: 6px; }
.line.yes .tag { color: #4ade80; }
.line.no .tag { color: #f87171; }
.line.answer .tag { color: #93c5fd; }
.line.gap .tag { color: #fbbf24; }
mark.bad-bit {
  background: color-mix(in srgb, #f87171 34%, transparent);
  color: inherit;
  padding: 0 2px;
  border-radius: 3px;
}
.line .fix {
  margin: 4px 0 0;
  font-size: .86rem;
  line-height: 1.45;
  color: color-mix(in srgb, var(--text) 86%, #f87171);
}
@media (prefers-color-scheme: light) {
  mark.bad-bit { background: #fecaca; }
  .line .fix { color: #7f1d1d; }
  .line.yes .tag { color: #15803d; }
  .line.no .tag { color: #b91c1c; }
  .line.answer .tag { color: #1d4ed8; }
  .line.gap .tag { color: #b45309; }
  .opt.yes { background: color-mix(in srgb, #86efac 45%, #fff); }
  .opt.no { background: color-mix(in srgb, #fecaca 55%, #fff); }
}
.empty { color: var(--muted); text-align: center; padding: 28px 10px; }
.cover {
  margin: 16px 0; padding: 18px; border-radius: 12px;
  border: 1px dashed var(--border); text-align: center; color: var(--muted);
}
footer.note-end { color: var(--muted); font-size: .75rem; text-align: center; margin-top: 18px; }
@media (max-width: 900px) {
  body { height: auto; overflow: auto; }
  .mobile-tabs { display: flex; }
  .panes { display: block; column-gap: 0; padding: 0; }
  #q-pane, #n-pane { border: 0; border-radius: 0; }
  #q-pane { display: block; overflow: visible; }
  #detail {
    flex: none;
    height: auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }
  .stem-wrap { flex: none; height: 10rem; }
  .choice-wrap { flex: none; height: 12.5rem; }
  #q-list { max-height: 42vh; overflow: auto; }
  #n-pane { overflow: visible; }
  body.mode-q #n-pane { display: none; }
  body.mode-n #q-pane { display: none; }
}
</style>
</head>
<body class="mode-q">
<header>
  <h1>HCIP 题库笔记</h1>
  <p class="sub">H12-821 486 题 · H12-831 379 题。右侧只整理本题库里被肯定的说法、被否定的说法和直接答案，不另补教材解释。点左侧题目，右侧滚到对应笔记。</p>
  <div class="toolbar">
    <div class="tabs" role="tablist" id="banks">
      <button type="button" class="tab active" data-bank="all">全部</button>
      <button type="button" class="tab" data-bank="H12-821">H12-821</button>
      <button type="button" class="tab" data-bank="H12-831">H12-831</button>
    </div>
    <select id="topic" aria-label="按主题筛选"></select>
    <input id="search" type="search" placeholder="搜索题干、选项或答案…" autocomplete="off" />
    <button type="button" class="btn" id="toggle-ans" aria-pressed="false">遮住答案自测</button>
  </div>
  <div class="stats" id="count"></div>
  <div class="mobile-tabs" role="tablist">
    <button type="button" class="mtab active" data-mode="q">题目</button>
    <button type="button" class="mtab" data-mode="n">笔记</button>
  </div>
</header>
<div class="panes">
  <section class="pane" id="q-pane" aria-label="题目">
    <div id="detail"></div>
    <div id="q-list"></div>
  </section>
  <section class="pane" id="n-pane" aria-label="笔记"></section>
</div>
<script src="notes-data.js"></script>
<script>
(function () {
  const DATA = window.STUDY_DATA;
  const detailEl = document.getElementById('detail');
  const listEl = document.getElementById('q-list');
  const notesEl = document.getElementById('n-pane');
  const countEl = document.getElementById('count');
  if (!DATA || !DATA.questions) {
    detailEl.textContent = '题库数据没有加载。';
    return;
  }

  const topicTitle = Object.fromEntries(DATA.topics.map(function (t) { return [t.id, t.title]; }));
  const byId = new Map(DATA.questions.map(function (q) { return [q.id, q]; }));
  const TYPE_SHORT = { '单选题': '单选', '多选题': '多选', '填空题': '填空', '简答题': '简答' };
  const LINE_TAG = { yes: '成立', no: '不成立', answer: '答案', gap: '无文字结论' };

  const topicSel = document.getElementById('topic');
  const searchEl = document.getElementById('search');
  const ansBtn = document.getElementById('toggle-ans');

  let bank = 'all';
  let topic = 'all';
  let query = '';
  let hideAns = false;
  let selected = DATA.questions[0].id;
  let view = DATA.questions.slice();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function markFalse(text, hi) {
    const t = String(text == null ? '' : text);
    if (!hi || t.indexOf(hi) < 0) return esc(t);
    let out = '';
    let from = 0;
    let at = t.indexOf(hi, from);
    while (at >= 0) {
      out += esc(t.slice(from, at)) + '<mark class="bad-bit">' + esc(hi) + '</mark>';
      from = at + hi.length;
      at = t.indexOf(hi, from);
    }
    return out + esc(t.slice(from));
  }
  function bankCode(q) { return q.bank === 'H12-831' ? '831' : '821'; }
  function label(q) { return bankCode(q) + ' #' + q.n; }
  function isTf(q) {
    if (!q.options || q.options.length !== 2) return false;
    const texts = q.options.map(function (o) { return o.t; });
    return texts.every(function (t) { return t === '正确' || t === '错误' || t === '对' || t === '错'; });
  }
  function optClass(q, opt) {
    if (hideAns || !q.answerKeys || q.answerKeys.indexOf(opt.k) < 0) return 'opt';
    if (isTf(q) && (opt.t === '错误' || opt.t === '错')) return 'opt no';
    return 'opt yes';
  }
  function matches(q) {
    if (bank !== 'all' && q.bank !== bank) return false;
    if (topic !== 'all' && q.topic !== topic) return false;
    if (!query) return true;
    const blob = (q.stem + ' ' + (q.options || []).map(function (o) { return o.k + ' ' + o.t; }).join(' ') + ' ' + (q.answerText || '')).toLowerCase();
    return blob.indexOf(query) >= 0;
  }
  function fillTopicSelect() {
    const cur = topic;
    let html = '<option value="all">全部主题</option>';
    DATA.topics.forEach(function (t) {
      html += '<option value="' + esc(t.id) + '">' + esc(t.title) + '（' + t.count + '）</option>';
    });
    topicSel.innerHTML = html;
    topicSel.value = cur;
  }
  function syncControls() {
    document.querySelectorAll('#banks .tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.bank === bank);
    });
    topicSel.value = topic;
    searchEl.value = query;
    ansBtn.textContent = hideAns ? '显示答案和笔记' : '遮住答案自测';
    ansBtn.setAttribute('aria-pressed', hideAns ? 'true' : 'false');
  }
  function save() {
    try {
      sessionStorage.setItem('hcip-notes-ui', JSON.stringify({
        bank: bank, topic: topic, query: query, selected: selected, hideAns: hideAns
      }));
    } catch (_) {}
  }
  function figsHtml(paths, eager) {
    if (!paths || !paths.length) return '';
    return '<div class="figs">' + paths.map(function (src) {
      return '<img src="' + esc(src) + '" alt="题目配图" ' + (eager ? '' : 'loading="lazy" ') + 'referrerpolicy="no-referrer" />';
    }).join('') + '</div>';
  }
  function renderDetail() {
    const q = byId.get(selected);
    const idx = view.findIndex(function (item) { return item.id === selected; });
    if (!q) { detailEl.innerHTML = '<div class="empty">没有可显示的题目</div>'; return; }
    const inView = idx >= 0;
    const pos = inView ? (idx + 1) : 0;
    const total = view.length;
    const falseAns = isTf(q) && q.answerKeys && q.answerKeys.some(function (k) {
      const opt = (q.options || []).find(function (o) { return o.k === k; });
      return opt && (opt.t === '错误' || opt.t === '错');
    });
    let html = '<div class="meta">';
    html += '<span class="badge ' + (q.bank === 'H12-831' ? 'b831' : 'b821') + '">' + esc(q.bank) + '</span>';
    html += '<span class="badge type">' + esc(TYPE_SHORT[q.type] || q.type) + '</span>';
    html += '<span class="badge topic">' + esc(topicTitle[q.topic] || q.topic) + '</span>';
    (q.tags || []).forEach(function (t) {
      if (t !== q.topic) html += '<span class="badge type">亦见 ' + esc(topicTitle[t] || t) + '</span>';
    });
    html += '<span class="q-no">' + esc(label(q)) + '</span></div>';
    html += '<div class="stem-wrap"><p class="stem">' + esc(q.stem) + '</p>';
    html += figsHtml(q.images, true);
    html += '</div><div class="choice-wrap">';
    if (q.options && q.options.length) {
      html += '<ul class="opts">';
      q.options.forEach(function (o) {
        html += '<li class="' + optClass(q, o) + '"><span class="key">' + esc(o.k) + '.</span>' + esc(o.t) + '</li>';
      });
      html += '</ul>';
    }
    if (!hideAns) {
      html += '<div class="ans-box' + (falseAns ? ' no' : '') + '"><div class="ans-label">题库答案</div><div class="ans-text">' + esc(q.answerText || '（无文字答案）') + '</div></div>';
      if (q.answerImages && q.answerImages.length) {
        html += '<div class="ans-label">答案配图</div>' + figsHtml(q.answerImages, true);
      }
    }
    html += '</div>';
    html += '<div class="pager">';
    html += '<button type="button" class="btn" id="prev"' + (pos <= 1 ? ' disabled' : '') + '>上一题</button>';
    html += '<div class="progress">' + (total ? ('第 ' + pos + ' / ' + total + ' 题') : '不在当前筛选中') + '</div>';
    html += '<button type="button" class="btn" id="next"' + (!total || pos >= total ? ' disabled' : '') + '>下一题</button>';
    html += '<label class="hint" for="jump">跳转</label><input class="jump" id="jump" type="number" min="1" max="' + (total || 1) + '" value="' + (pos || '') + '" />';
    html += '<button type="button" class="btn" id="locate">定位笔记</button>';
    html += '<span class="hint">← → 翻题</span></div>';
    detailEl.innerHTML = html;
  }
  function renderList() {
    if (!view.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的题目</div>';
      return;
    }
    listEl.innerHTML = view.map(function (q) {
      const active = q.id === selected ? ' active' : '';
      const one = q.stem.length > 72 ? q.stem.slice(0, 72) + '…' : q.stem;
      return '<button type="button" class="q-item' + active + '" data-id="' + esc(q.id) + '">' +
        '<span class="row"><span class="q-no">' + esc(label(q)) + '</span>' +
        '<span class="badge type">' + esc(TYPE_SHORT[q.type] || q.type) + '</span>' +
        '<span class="badge topic">' + esc(topicTitle[q.topic] || '') + '</span></span>' +
        '<span class="q-one">' + esc(one) + '</span></button>';
    }).join('');
  }
  function renderNotes() {
    if (hideAns) {
      notesEl.innerHTML = '<div class="cover">自测中，笔记已遮住。做完左侧题目后点「显示答案和笔记」。</div>';
      return;
    }
    const ids = new Set(view.map(function (q) { return q.id; }));
    let html = '<div class="legend"><b class="yes">成立</b> 题库肯定的说法 · <b class="no">不成立</b> 判断题或找错项里被否定的说法，浅红是错误措辞，下面一句是正确说法 · <b class="answer">答案</b> 这道题选出的项或填空 · <b class="gap">无文字结论</b> 答案只在配图里</div>';
    let any = false;
    DATA.notes.forEach(function (topicBlock) {
      const sections = [];
      (topicBlock.sections || []).forEach(function (sec) {
        const items = (sec.items || []).filter(function (it) {
          return (it.qids || []).some(function (id) { return ids.has(id); });
        });
        if (items.length) sections.push({ sec: sec, items: items });
      });
      if (!sections.length) return;
      any = true;
      const shown = sections.reduce(function (n, s) { return n + s.items.length; }, 0);
      html += '<article class="topic-block" id="topic-' + esc(topicBlock.id) + '">';
      html += '<h2>' + esc(topicBlock.title) + '<span>' + shown + ' 条</span></h2>';
      sections.forEach(function (wrap) {
        html += '<section class="sec-block"><h3>' + esc(wrap.sec.title) + '<span>' + wrap.items.length + '</span></h3>';
        wrap.items.forEach(function (it) {
          const qids = (it.qids || []).filter(function (id) { return ids.has(id); });
          html += '<article class="note" data-qids="' + esc(qids.join(',')) + '" id="note-' + esc(qids[0]) + '">';
          html += '<div class="refs">';
          qids.forEach(function (id) {
            const q = byId.get(id);
            html += '<button type="button" class="qref" data-qid="' + esc(id) + '">' + esc(q ? label(q) : id) + '</button>';
          });
          html += '</div>';
          if (it.lead) html += '<p class="lead">' + esc(it.lead) + '</p>';
          (it.lines || []).forEach(function (line) {
            const p = line.p || 'answer';
            html += '<div class="line ' + esc(p) + '"><span class="tag">' + esc(LINE_TAG[p] || '笔记') + '</span>' + markFalse(line.t, p === 'no' ? line.hi : '');
            if (p === 'no' && line.fix) html += '<p class="fix">' + esc(line.fix) + '</p>';
            html += '</div>';
          });
          if (it.images && it.images.length) {
            html += '<div class="note-figs">' + it.images.map(function (src) {
              return '<img src="' + esc(src) + '" alt="题目配图" loading="lazy" referrerpolicy="no-referrer" />';
            }).join('') + '</div>';
          }
          html += '</article>';
        });
        html += '</section>';
      });
      html += '</article>';
    });
    if (!any) html += '<div class="empty">当前筛选下没有笔记</div>';
    html += '<footer class="note-end">笔记共覆盖两个题库 865 题 · 仅供个人复习</footer>';
    notesEl.innerHTML = html;
  }
  function scrollInto(container, el, align) {
    if (!el) return;
    const paneScrolls = container && container.scrollHeight > container.clientHeight + 8;
    if (!paneScrolls) {
      try { el.scrollIntoView({ block: align === 'center' ? 'center' : 'nearest' }); } catch (_) {}
      return;
    }
    const cRect = container.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    let delta;
    if (align === 'center') {
      const legend = container.querySelector('.legend');
      const legendH = legend ? legend.offsetHeight : 0;
      const visibleH = Math.max(40, container.clientHeight - legendH);
      if (eRect.height >= visibleH - 16) {
        delta = eRect.top - (cRect.top + legendH + 10);
      } else {
        const viewCenter = cRect.top + legendH + visibleH / 2;
        const elCenter = eRect.top + eRect.height / 2;
        delta = elCenter - viewCenter;
      }
    } else {
      delta = eRect.top - cRect.top - 8;
    }
    const max = Math.max(0, container.scrollHeight - container.clientHeight);
    container.scrollTop = Math.max(0, Math.min(max, container.scrollTop + delta));
  }
  function highlight(opts) {
    const q = byId.get(selected);
    listEl.querySelectorAll('.q-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.id === selected);
    });
    notesEl.querySelectorAll('.note').forEach(function (el) {
      const ids = (el.dataset.qids || '').split(',');
      const on = ids.indexOf(selected) >= 0;
      el.classList.toggle('hit', on);
      el.querySelectorAll('.qref').forEach(function (btn) {
        btn.classList.toggle('here', btn.dataset.qid === selected);
      });
    });
    countEl.textContent = '当前 ' + view.length + ' / ' + DATA.questions.length + ' 题'
      + (q ? (' · 正在看 ' + label(q) + ' · ' + (topicTitle[q.topic] || '')) : '');
    if (!(opts && (opts.scrollList || opts.scrollNote))) return;
    requestAnimationFrame(function () {
      if (opts.scrollList) {
        const active = listEl.querySelector('.q-item.active');
        scrollInto(listEl, active, 'start');
        if (window.matchMedia('(max-width: 900px)').matches) {
          const pane = document.getElementById('q-pane');
          if (pane) { try { pane.scrollIntoView({ block: 'start' }); } catch (_) {} }
        }
      }
      if (opts.scrollNote) {
        const hit = notesEl.querySelector('.note.hit');
        scrollInto(notesEl, hit, 'center');
      }
    });
  }
  function renderAll(opts) {
    view = DATA.questions.filter(matches);
    if (!view.some(function (q) { return q.id === selected; })) {
      if (view[0]) selected = view[0].id;
    }
    syncControls();
    renderList();
    renderNotes();
    renderDetail();
    highlight(opts || {});
    save();
  }
  function select(id, opts) {
    if (!byId.has(id)) return;
    selected = id;
    if (!view.some(function (q) { return q.id === id; })) {
      bank = 'all';
      topic = 'all';
      query = '';
      view = DATA.questions.slice();
      syncControls();
      renderList();
      renderNotes();
    }
    renderDetail();
    highlight(opts || {});
    try { history.replaceState(null, '', '#' + id); } catch (_) {}
    save();
  }
  function step(delta) {
    const idx = view.findIndex(function (q) { return q.id === selected; });
    const next = idx + delta;
    if (next < 0 || next >= view.length) return;
    select(view[next].id, { scrollNote: true, scrollList: true });
  }
  function setMode(mode) {
    document.body.classList.toggle('mode-q', mode === 'q');
    document.body.classList.toggle('mode-n', mode === 'n');
    document.querySelectorAll('.mtab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  fillTopicSelect();
  try {
    const saved = JSON.parse(sessionStorage.getItem('hcip-notes-ui') || 'null');
    if (saved) {
      if (saved.bank) bank = saved.bank;
      if (saved.topic) topic = saved.topic;
      if (typeof saved.query === 'string') query = saved.query;
      if (saved.selected && byId.has(saved.selected)) selected = saved.selected;
      hideAns = !!saved.hideAns;
    }
  } catch (_) {}
  const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if (byId.has(hash)) {
    selected = hash;
    bank = 'all';
    topic = 'all';
    query = '';
  }

  document.getElementById('banks').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-bank]');
    if (!btn) return;
    bank = btn.dataset.bank;
    renderAll({ scrollList: true });
  });
  topicSel.addEventListener('change', function () {
    topic = topicSel.value;
    renderAll({ scrollList: true, scrollNote: true });
  });
  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim().toLowerCase();
    renderAll();
  });
  ansBtn.addEventListener('click', function () {
    hideAns = !hideAns;
    renderAll({ scrollNote: !hideAns });
  });
  document.querySelectorAll('.mtab').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });
  listEl.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-id]');
    if (!btn) return;
    select(btn.dataset.id, { scrollNote: true });
  });
  notesEl.addEventListener('click', function (e) {
    const lead = e.target.closest('.lead');
    if (lead) lead.classList.toggle('open');
    const ref = e.target.closest('[data-qid]');
    const card = e.target.closest('.note');
    const qid = (ref && ref.dataset.qid) || (card && (card.dataset.qids || '').split(',').filter(Boolean)[0]);
    if (!qid) return;
    if (window.matchMedia('(max-width: 900px)').matches) setMode('q');
    select(qid, { scrollList: true });
  });
  detailEl.addEventListener('click', function (e) {
    if (e.target.id === 'prev') step(-1);
    else if (e.target.id === 'next') step(1);
    else if (e.target.id === 'locate') {
      highlight({ scrollNote: true });
      if (window.matchMedia('(max-width: 900px)').matches) setMode('n');
    }
  });
  detailEl.addEventListener('change', function (e) {
    if (e.target.id !== 'jump') return;
    const n = parseInt(e.target.value, 10);
    if (!n || n < 1 || n > view.length) return;
    select(view[n - 1].id, { scrollNote: true, scrollList: true });
  });
  document.addEventListener('keydown', function (e) {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === '/' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); searchEl.focus(); }
  });

  renderAll({ scrollList: true, scrollNote: byId.has(hash) });
})();
</script>
</body>
</html>
